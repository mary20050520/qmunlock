[package]
name = "qmunlock-desktop"
version = "1.0.0"
description = "Cross-platform musicex decoder for files downloaded by the current user"
authors = ["QM Unlock contributors"]
edition = "2021"

[lib]
name = "qmunlock_desktop_lib"
# Desktop targets link the Rust library statically.  Avoiding a Windows cdylib
# also keeps GNU cross builds within the PE export-table limit.
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
dirs = "6"
id3 = "1"
plist = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_System_Threading"] }
